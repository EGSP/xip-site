<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!--
        Знак XIP без подложки: три строки журнала разной длины. Крайние строки меняют цвет
        вслед за оформлением браузера, поэтому знак различим и на светлой, и на тёмной панели
        вкладок; средняя строка окрашена основным цветом темы сайта.
    -->
    <style>
        .line { fill: #19191c; }
        @media (prefers-color-scheme: dark) {
            .line { fill: #f4f4f5; }
        }
    </style>
    <rect class="line" x="2" y="6" width="28" height="4" />
    <rect x="2" y="14" width="17" height="4" fill="#4d7cff" />
    <rect class="line" x="2" y="22" width="23" height="4" />
</svg>
